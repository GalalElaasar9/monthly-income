<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Main Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Back flap / money peaking out -->
    <rect x="136" y="140" width="240" height="90" rx="18" fill="#ecfdf5" opacity="0.9" />
    <path d="M 180 140 Q 256 120 332 140" stroke="#10b981" stroke-width="4" fill="none" />

    <!-- Wallet base -->
    <rect x="106" y="180" width="300" height="210" rx="36" fill="url(#walletGrad)" />

    <!-- Flap stitching / curve -->
    <path d="M 106 240 Q 256 270 406 240" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 6" fill="none" />

    <!-- Wallet Clasp / Pocket -->
    <path d="M 330 250 L 395 250 A 25 25 0 0 1 420 275 L 420 305 A 25 25 0 0 1 395 330 L 330 330 Z" fill="#0f172a" />
    <!-- Clasp button / Golden emblem -->
    <circle cx="380" cy="290" r="14" fill="url(#coinGrad)" stroke="#d97706" stroke-width="3" />

    <!-- Small Sparkle Icon -->
    <path d="M 160 270 Q 170 270 170 260 Q 170 270 180 270 Q 170 270 170 280 Q 170 270 160 270 Z" fill="#10b981" />
    <!-- Egyptian Pound Symbol or Currency Text -->
    <text x="220" y="315" font-family="Tajawal, sans-serif" font-size="64" font-weight="900" fill="#059669">£</text>
  </g>
</svg>